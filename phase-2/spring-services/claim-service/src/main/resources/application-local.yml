server:
  port: 8080

spring:
  application:
    name: claim-service
  datasource:
    url: jdbc:h2:mem:trinetradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    listener:
      simple:
        auto-startup: false
