server:
  port: 8080

spring:
  application:
    name: claim-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trinetra}
    username: ${POSTGRES_USER:trinetra_user}
    password: ${POSTGRES_PASSWORD:trinetra_dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:trinetra_admin}
    password: ${RABBITMQ_PASS:trinetra_rabbit_pass}

trinetra:
  queues:
    evidence-uploaded: evidence.uploaded
    verdict-generated: verdict.generated
