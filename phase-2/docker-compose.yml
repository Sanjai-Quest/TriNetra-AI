version: '3.8'

services:

  # ─── Primary Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: trinetra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_USER: trinetra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trinetra_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - trinetra_pg_data:/var/lib/postgresql/data
      - ./schema/schema_extensions.sql:/docker-entrypoint-initdb.d/01_schema_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra_user -d trinetra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trinetra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-trinetra_redis_pass}
    volumes:
      - trinetra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message Broker ───────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: trinetra_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trinetra_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-trinetra_rabbit_pass}
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - trinetra_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Object Storage (Images / Receipts) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: trinetra_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trinetra_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trinetra_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console: http://localhost:9001
    command: server /data --console-address ":9001"
    volumes:
      - trinetra_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch (Audit Logs + Analytics) ───────────────────────────────
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: trinetra_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - trinetra_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── TriNetra Services ────────────────────────────────────────────────────
  claim_service:
    build:
      context: .
      dockerfile: services/claim_service/Dockerfile
    container_name: trinetra_claim_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  evidence_service:
    build:
      context: .
      dockerfile: services/evidence_service/Dockerfile
    container_name: trinetra_evidence_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  multimodal_processor:
    build:
      context: .
      dockerfile: services/multimodal_processor/Dockerfile
    container_name: trinetra_multimodal_processor
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  fraud_engine:
    build:
      context: .
      dockerfile: services/fraud_engine/Dockerfile
    container_name: trinetra_fraud_engine
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  verdict_generator:
    build:
      context: .
      dockerfile: services/verdict_generator/Dockerfile
    container_name: trinetra_verdict_generator
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  integration_service:
    build:
      context: .
      dockerfile: services/integration_service/Dockerfile
    container_name: trinetra_integration_service
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Dashboard (Static file server) ──────────────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: trinetra_dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

volumes:
  trinetra_pg_data:
  trinetra_redis_data:
  trinetra_rabbit_data:
  trinetra_minio_data:
  trinetra_es_data:
